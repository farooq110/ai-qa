# Proofline QA — reverse proxy for the docker stack on 31.97.105.193
# certbot --nginx adds the 443 blocks + HTTP->HTTPS redirects on first run.

upstream proofline_web {
    server 127.0.0.1:3004;
}
upstream proofline_api {
    server 127.0.0.1:8080;
}
upstream proofline_admin {
    server 127.0.0.1:8081;
}

# Web app (root + www)
server {
    listen 80;
    server_name prooflineqa.com www.prooflineqa.com;

    location / {
        proxy_pass http://proofline_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API control plane
server {
    listen 80;
    server_name api.prooflineqa.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://proofline_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin console
server {
    listen 80;
    server_name admin.prooflineqa.com;

    location / {
        proxy_pass http://proofline_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
