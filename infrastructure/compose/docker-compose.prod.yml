name: agentic-qa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proofline
      POSTGRES_PASSWORD: ${PROD_DATABASE_PASSWORD}
      POSTGRES_DB: proofline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofline -d proofline"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file:
      - ../../.env.production
    environment:
      API_PORT: "4000"
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:4000"
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file:
      - ../../.env.production
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3004:3004"
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:3005"
    restart: unless-stopped

  demo-app:
    build:
      context: ../..
      dockerfile: infrastructure/docker/demo.Dockerfile
    # Internal only — the worker reaches it at http://demo-app:4600
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
